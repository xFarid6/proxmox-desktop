[package]
name = "proxmox-desktop"
version = "0.2.0"
description = "Native desktop client for Proxmox VE"
authors = ["xFarid6"]
license = "FSL-1.1-MIT"
edition = "2021"
# The `pxx` bin below makes this a two-binary crate, and `tauri build` then
# cannot tell which one is the app ("failed to find main binary").
default-run = "proxmox-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "proxmox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pxx"
path = "src/bin/pxx.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "sync"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rustls = "0.23"
webpki-roots = "0.26"
tauri-plugin-notification = "2.3.3"
conn-manager = { git = "https://github.com/xFarid6/conn-manager-rs", rev = "ded32be7b89d1c570c10705af583ac8219130051" }
# ring backend: the default aws-lc-rs needs NASM on Windows; ring doesn't.
# async-trait works around a Send-not-general-enough inference error on
# Signer::auth_publickey_sign's RPITIT (needed for agent auth) -- the
# crate's own conditional compilation exists specifically for this.
russh = { version = "0.54", default-features = false, features = ["flate2", "ring", "async-trait"] }
if-addrs = "0.15.0"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
rand_core = { version = "0.6", features = ["getrandom"] }

